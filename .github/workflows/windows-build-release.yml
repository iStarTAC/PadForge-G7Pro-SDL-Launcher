name: Windows build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out the all-in-one source tree
        uses: actions/checkout@v7

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build and test the complete package
        shell: pwsh
        run: .\build.ps1 -PackageDirectory '.\artifacts\win-x64'

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path '.\artifacts\win-x64\*' -DestinationPath '.\artifacts\PadForge-G7Pro-${{ github.ref_name }}-win-x64.zip' -CompressionLevel Optimal

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: PadForge-G7Pro-${{ github.ref_name }}-win-x64
          path: artifacts/PadForge-G7Pro-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesFile = '.\RELEASE_NOTES_${{ github.ref_name }}.md'
          $archive = '.\artifacts\PadForge-G7Pro-${{ github.ref_name }}-win-x64.zip'
          if (Test-Path -LiteralPath $notesFile) {
            gh release create '${{ github.ref_name }}' $archive --verify-tag --notes-file $notesFile --title 'PadForge G7 Pro ${{ github.ref_name }}'
          } else {
            gh release create '${{ github.ref_name }}' $archive --verify-tag --generate-notes --title 'PadForge G7 Pro ${{ github.ref_name }}'
          }
